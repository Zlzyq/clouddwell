server:
  port: 9101

spring:
  application:
    name: cloud-auth
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        enabled: ${NACOS_ENABLED:true}

cloud:
  security:
    jwt:
      secret: ${JWT_SECRET:cloud-dwell-dev-only-secret-please-change-me-32}
      issuer: cloud-auth
      access-token-ttl-seconds: 7200

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
