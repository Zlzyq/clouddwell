server:
  port: 9103

spring:
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  application:
    name: cloud-business
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cloud_business?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:cloud_dwell}
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 1s #设置mq的链接超时时间
    template:
      retry:
        enabled: true #开启超时重试机制
        #以上都是默认的 只需要开启重试机制
    publisher-confirm-type: correlated #回调方式 具体需要自己配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        enabled: ${NACOS_ENABLED:true}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 8000
          # Feign 带 contextId 时按 contextId 匹配配置，不能只用服务名 cloud-system
          systemUserFeignClient:
            url: ${FEIGN_CLOUD_SYSTEM_URL:http://127.0.0.1:9102}
          systemProductFeignClient:
            url: ${FEIGN_CLOUD_SYSTEM_URL:http://127.0.0.1:9102}

cloud:
  security:
    jwt:
      secret: ${JWT_SECRET:cloud-dwell-dev-only-secret-please-change-me-32}
  demo:
    data-dir: ./data/demo

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
