server:
  port: 9113
spring:
  application:
    name: cloud-booking
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cloud_booking?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:true}
cloud:
  demo:
    data-dir: ./data/booking
  security:
    jwt:
      secret: ${JWT_SECRET:cloud-dwell-dev-only-secret-please-change-me-32}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
